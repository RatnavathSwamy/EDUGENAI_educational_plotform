<!DOCTYPE html>
<html>

<head>

    <title>EduGen AI - Sign Up</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .signup-box {
            width: 400px;
            max-width: 90%;
            padding: 35px;
            background: #1e293b;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            cursor: pointer;
        }

        .error {
            color: #f87171;
        }

        a {
            color: #a78bfa;
        }

    </style>

</head>

<body>

<div class="signup-box">

    <h1>📘 EduGen AI</h1>

    <h2>Create Account</h2>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>

        Already have an account?

        <a href="/login/">
            Login
        </a>

    </p>

</div>

</body>

</html>
